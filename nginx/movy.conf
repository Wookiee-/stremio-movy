# movy.ddns.net - nginx reverse proxy to movy:7000 (docker)
# This file is mounted to /etc/nginx/conf.d/default.conf in the nginx container
# Handles: HTTP challenge for certbot + HTTPS with certbot certs

# --- HTTP: acme-challenge + redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name movy.ddns.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # during initial cert issuance, proxy directly so site works on HTTP
        # after TLS is ready, this redirects (keep 301 if you want HSTS):
        # return 301 https://$host$request_uri;
        proxy_pass http://movy:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        client_max_body_size 0;
    }
}

# --- HTTPS: only active after certs exist at /etc/letsencrypt/live/movy.ddns.net/ ---
# If nginx fails to start with "no such file" for ssl_certificate, comment this
# server block out, run ./setup-docker.sh --email you@example.com, then uncomment.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name movy.ddns.net;

    ssl_certificate /etc/letsencrypt/live/movy.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/movy.ddns.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # optional: HSTS (enable after you confirm HTTPS works)
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://movy:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        client_max_body_size 0;
        proxy_max_temp_file_size 0;
    }
}
